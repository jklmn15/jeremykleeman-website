<div id="navbar-placeholder"></div>
<script>
  fetch('navbar.html')
    .then(r => r.text())
    .then(html => {
      document.getElementById('navbar-placeholder').innerHTML = html;
      const page = location.pathname.split('/').pop().replace('.html', '') || 'index';
      const link = document.querySelector('[data-page="' + page + '"]');
      if (link) { link.classList.add('active'); link.setAttribute('aria-current', 'page'); }
      const navCollapse = document.getElementById('navbarNav');
      const overlay = document.querySelector('.nav-overlay');
      if (navCollapse && overlay) {
        navCollapse.addEventListener('show.bs.collapse', () => overlay.classList.add('active'));
        navCollapse.addEventListener('hide.bs.collapse', () => overlay.classList.remove('active'));
        overlay.addEventListener('click', () => {
          navCollapse.classList.remove('show');
          overlay.classList.remove('active');
        });
      }
    });
</script>

<div class="container py-5">
  <h2 class="section-heading mb-4 text-center">Representation</h2>

  <div class="row justify-content-center">
    <div class="col-12 col-lg-8">

      <section class="representation-card p-4 p-md-5 mb-4 text-center">
  <p class="representation-text mb-3">
    <strong>Jeremy</strong> is proudly represented by<br>
    <strong>Stephen McAllan</strong> at 
    <strong>
      <a href="https://www.emblemartists.com" target="_blank" rel="noopener noreferrer" class="email-link" style="font-size: inherit; font-weight: inherit;">
        Emblem Artists

    <a href="mailto:stephen@emblemartists.com" class="email-link">
      stephen@emblemartists.com

  </p>
</section>


      <h2 class="section-heading mt-5 mb-4 text-center">Get In Touch</h2>

      <section id="contact-form" class="contact-card p-4 p-md-5">
        <p class="text-center text-muted mb-4">Send a message directly to Jeremy</p>

        <div id="contact-success" class="text-center py-4" style="display:none;">
          <i class="bi bi-check-circle-fill text-success" style="font-size:2.5rem;"></i>
          <p class="mt-3 text-light fs-5">Thanks — your message has been sent. Jeremy will be in touch soon.</p>
        </div>

        <form id="contact-form-el" action="https://formspree.io/f/movplpan" method="POST" class="contact-form">
          <div class="mb-4">
            <input type="text" name="name" class="form-control form-control-lg" placeholder="Your Name" required>
          </div>
          <div class="mb-4">
            <input type="email" name="_replyto" class="form-control form-control-lg" placeholder="Your Email" required>
          </div>
          <div class="mb-4">
            <textarea name="message" class="form-control form-control-lg" rows="6" placeholder="Your Message" required></textarea>
          </div>
          <div class="text-end">
            <button type="submit" class="btn btn-primary btn-lg px-5">Send Message</button>
          </div>
        </form>

        <script>
          document.getElementById('contact-form-el').addEventListener('submit', function(e) {
            e.preventDefault();
            var form = this;
            fetch(form.action, {
              method: 'POST',
              body: new FormData(form),
              headers: { 'Accept': 'application/json' }
            }).then(function(res) {
              if (res.ok) {
                form.style.display = 'none';
                document.getElementById('contact-success').style.display = 'block';
              } else {
                alert('Something went wrong — please try emailing directly.');
              }
            }).catch(function() {
              alert('Something went wrong — please try emailing directly.');
            });
          });
        </script>
      </section>
