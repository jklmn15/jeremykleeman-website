<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>JKLMN Web Design | Boutique Artist Websites</title>
  <meta name="description" content="Boutique artist websites by JKLMN Web Design. Simple, elegant sites for performers and creatives.">

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link href="styles.css" rel="stylesheet">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=PT+Serif:ital,wght@0,400;0,700;1,400;1,700&display=swap" rel="stylesheet">

  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
  <link rel="manifest" href="/site.webmanifest">

  <style>
    .page-hero {
      padding: 5rem 0;
      background: linear-gradient(rgba(0,0,0,0.8), rgba(0,0,0,0.8));
    }
    .hero-title {
      font-size: 3.5rem;
      font-family: 'Bebas Neue', sans-serif;
      letter-spacing: 2px;
      text-shadow: 0px 2px 4px rgba(0,0,0,1);
    }
    p, li { font-size: 1.15rem; line-height: 1.7; }
  </style>
</head>

<body>

<div id="navbar-placeholder"></div>
<script>
  fetch('navbar.html')
    .then(r => r.text())
    .then(html => {
      document.getElementById('navbar-placeholder').innerHTML = html;
      const page = location.pathname.split('/').pop().replace('.html', '') || 'index';
      const link = document.querySelector('[data-page="' + page + '"]');
      if (link) { link.classList.add('active'); link.setAttribute('aria-current', 'page'); }
      const navCollapse = document.getElementById('navbarNav');
      const overlay = document.querySelector('.nav-overlay');
      if (navCollapse && overlay) {
        navCollapse.addEventListener('show.bs.collapse', () => overlay.classList.add('active'));
        navCollapse.addEventListener('hide.bs.collapse', () => overlay.classList.remove('active'));
        overlay.addEventListener('click', () => {
          navCollapse.classList.remove('show');
          overlay.classList.remove('active');
        });
      }
    });
</script>

<section class="page-hero text-center">
  <div class="container">
    <h1 class="hero-title text-white mb-2">JKLMN Web Design</h1>
    <p class="lead text-white opacity-75 mb-0" style="font-size: 1.5rem;">Boutique Artist Websites</p>
  </div>
</section>

<div class="container my-5">

  <div class="row justify-content-center">
    <div class="col-12 col-lg-8 text-center">
      <p class="text-light lead mb-5">Boutique artist websites (like this one). Please use the contact form below for any enquiries.</p>
    </div>
  </div>

  <div class="section-divider my-5"></div>

  <div class="row justify-content-center">
    <div class="col-12 col-lg-8">

      <section class="contact-card p-4 p-md-5 border border-secondary border-opacity-25 rounded" style="background: rgba(0,0,0,0.2);">

        <div id="webdesign-success" class="text-center py-4" style="display:none;">
          <i class="bi bi-check-circle-fill text-success" style="font-size:2.5rem;"></i>
          <p class="mt-3 text-light fs-5">Thanks for your enquiry — we'll be in touch soon.</p>
        </div>

        <form id="webdesign-form-el" action="https://formspree.io/f/movplpan" method="POST" class="contact-form">
          <input type="hidden" name="_subject" value="JKLMN Web Design Enquiry" />

          <h4 class="text-white mb-4 text-center">Get in Touch</h4>

          <div class="row">
            <div class="col-md-6 mb-4">
              <input type="text" name="name" class="form-control form-control-lg" placeholder="Name" required>
            </div>
            <div class="col-md-6 mb-4">
              <input type="email" name="_replyto" class="form-control form-control-lg" placeholder="Email" required>
            </div>
          </div>

          <div class="mb-4">
            <textarea name="message" class="form-control form-control-lg" rows="5" placeholder="Tell me a little about your project..." required></textarea>
          </div>

          <div class="text-center">
            <button type="submit" class="btn btn-primary btn-lg px-5 py-3 shadow fs-5">
              <i class="bi bi-envelope-paper-fill me-2"></i> Submit Enquiry
            </button>
          </div>
        </form>

        <script>
          document.getElementById('webdesign-form-el').addEventListener('submit', function(e) {
            e.preventDefault();
            var form = this;
            fetch(form.action, {
              method: 'POST',
              body: new FormData(form),
              headers: { 'Accept': 'application/json' }
            }).then(function(res) {
              if (res.ok) {
                form.style.display = 'none';
                document.getElementById('webdesign-success').style.display = 'block';
              } else {
                alert('Something went wrong — please try emailing directly.');
              }
            }).catch(function() {
              alert('Something went wrong — please try emailing directly.');
            });
          });
        </script>

      </section>

    </div>
  </div>

</div>

<div id="footer-placeholder"></div>
<script>
  fetch('footer.html')
    .then(res => res.text())
    .then(html => {
      document.getElementById('footer-placeholder').innerHTML = html;
    });
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
